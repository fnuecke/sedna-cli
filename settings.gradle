def substituteLocal(final propertyName, final libraryName) {
    final def configured = providers.gradleProperty(propertyName).orNull
    if (configured == null || configured.isBlank()) {
        return
    }
    def path = new File(configured)
    if (!path.isAbsolute()) {
        path = new File(rootDir, configured)
    }
    if (!path.isDirectory()) {
        throw new IllegalStateException("[${propertyName}] is set to [${configured}], which is not a directory.")
    }
    println("Substituting [${libraryName}] from local [${path.canonicalPath}]")
    includeBuild(path) {
        dependencySubstitution {
            substitute module(libraryName) using project(':')
        }
    }
}

substituteLocal('ceresDir', 'li.cil.ceres:ceres')
substituteLocal('sednaDir', 'li.cil.sedna:sedna')
substituteLocal('buildrootDir', 'li.cil.sedna:sedna-buildroot')

rootProject.name = 'sedna-cli'
