plugins {
    id 'java'
    id 'maven-publish'
    id 'application'
}

def getGitRef() {
    try {
        final def ref = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return ref.isEmpty() ? 'unknown' : ref
    } catch (final Throwable ignored) {
        return 'unknown'
    }
}

final String semver = "${version_major}.${version_minor}.${version_patch}"

String build_number = System.getenv('PROMOTED_NUMBER')
if (build_number == null)
    build_number = System.getenv('BUILD_NUMBER')
if (build_number == null)
    build_number = getGitRef()

version = "${semver}+${build_number}"
group = 'li.cil.sedna'

java.toolchain {
    languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = uri('https://fnuecke.github.io/maven')
            }
        }
        filter {
            includeModule('li.cil.sedna', 'sedna-buildroot')
        }
    }
    mavenCentral()
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-api:2.17.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.0'

    implementation 'org.jline:jline:3.20.0'
    implementation 'org.jline:jline-terminal-jna:3.20.0'
    implementation 'net.java.dev.jna:jna:5.9.0'

    implementation 'li.cil.ceres:ceres:0.0.6'
    implementation 'li.cil.sedna:sedna:2.1.0'
    implementation 'li.cil.sedna:sedna-buildroot:0.0.9'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        final def mavenPath = System.getenv('MAVEN_PATH')
        if (mavenPath) {
            maven {
                url = uri(mavenPath)
            }
        }
    }
}

application {
    mainClass = 'li.cil.sedna.cli.Main'
}

tasks.named('run') {
    standardInput = System.in
    standardOutput = System.out
}

test {
    useJUnitPlatform()
}
